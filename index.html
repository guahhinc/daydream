<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mogger | Advanced Facial Analysis</title>
    <meta name="description" content="Discover your facial potential with Mogger's advanced AI tracking. Analyze symmetry, proportions, and get your Mog Score.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="logo-text">MOGGER</span>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-label">AI ACTIVE</span>
                </div>
            </div>
            <nav>
                <button class="nav-btn active">ANALYZER</button>
                <button class="nav-btn">DATABASE</button>
                <button class="nav-btn">UPGRADE</button>
            </nav>
        </header>

        <main>
            <div class="video-section">
                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="output_canvas"></canvas>
                    <div class="scanner-line"></div>
                    <div class="ui-overlays">
                        <div class="corner top-left"></div>
                        <div class="corner top-right"></div>
                        <div class="corner bottom-left"></div>
                        <div class="corner bottom-right"></div>
                    </div>
                </div>
                <div class="camera-controls">
                    <button id="camera-toggle" class="control-btn">
                        <span class="icon">📷</span> START CAMERA
                    </button>
                    <button id="capture-btn" class="control-btn secondary">
                        <span class="icon">📸</span> CAPTURE
                    </button>
                </div>
            </div>

            <aside class="sidebar">
                <div class="stats-panel glass">
                    <h3>FACIAL ANALYSIS</h3>
                    <div class="stat-group">
                        <div class="stat-item">
                            <span class="label">SYMMETRY</span>
                            <div class="progress-bar">
                                <div id="symmetry-bar" class="fill" style="width: 0%"></div>
                            </div>
                            <span id="symmetry-val" class="value">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="label">JAWLINE</span>
                            <div class="progress-bar">
                                <div id="jawline-bar" class="fill" style="width: 0%"></div>
                            </div>
                            <span id="jawline-val" class="value">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="label">EYE SPACING</span>
                            <div class="progress-bar">
                                <div id="eye-bar" class="fill" style="width: 0%"></div>
                            </div>
                            <span id="eye-val" class="value">0%</span>
                        </div>
                    </div>
                </div>

                <div class="score-panel glass">
                    <h3>MOG SCORE</h3>
                    <div class="score-display">
                        <span id="mog-score" class="score-number">0.0</span>
                        <span class="score-max">/ 10</span>
                    </div>
                    <div id="score-rank" class="score-rank">CALIBRATING...</div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card glass">
                        <span class="label">WIDTH</span>
                        <span id="face-width" class="value">--</span>
                    </div>
                    <div class="metric-card glass">
                        <span class="label">RATIO</span>
                        <span id="face-ratio" class="value">--</span>
                    </div>
                </div>

                <div class="recent-mogs glass">
                    <h3>RECENT MOGS</h3>
                    <div id="mog-log" class="mog-log">
                        <!-- Thumbnails will appear here -->
                        <div class="empty-log">NO CAPTURES YET</div>
                    </div>
                </div>
            </aside>
        </main>

        <footer>
            <p>&copy; 2024 MOGGER LABS. BUILT FOR PEAK PERFORMANCE.</p>
        </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loader"></div>
        <p>INITIALIZING NEURAL NETWORKS...</p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
