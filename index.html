<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PARADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        :root {
            --bg: #030303;
            --surface: #111111;
            --surface-hover: #1f1f1f;
            --text: #ffffff;
            --text-muted: #777777;
            --accent: #ffffff;
            --border: #2a2a2a;
            --nav-height: calc(88px + env(safe-area-inset-bottom));
            --header-height: calc(52px + env(safe-area-inset-top));
            --radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter Tight', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden; 
        }

        /* Headings & Actions in ALL CAPS */
        h1, h2, h3, h4, h5, h6, .item-title, .tag, button, .modal-title {
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Standard text elements (no caps) */
        p, span, li, input, textarea, .exercise-reps, .exercise-name, .pro-tip-content, .gradient-quote-text {
            text-transform: none;
        }

        /* Layout */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        header {
            height: var(--header-height);
            padding: env(safe-area-inset-top) 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: 800;
        }

        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 20px;
        }

        .view {
            display: none;
            padding: 20px;
            min-height: 100%;
            animation: fadeIn 0.2s ease-out;
        }

        .view.active {
            display: block;
        }

        /* Bottom Nav */
        nav {
            height: var(--nav-height);
            padding-bottom: calc(32px + env(safe-area-inset-bottom)); /* Slightly bigger gap to avoid home line collision */
            background: var(--bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 10;
            position: relative;
            box-sizing: border-box;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            flex: 1;
            height: 100%;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item.active {
            color: var(--text);
        }

        .nav-item .material-symbols-outlined {
            font-size: 30px; /* Slightly bigger icons */
        }

        /* UI Components */
        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            padding: 14px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active {
            background: var(--text-muted);
            border-color: var(--text-muted);
            color: var(--bg);
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        button.secondary:active {
            background: var(--surface-hover);
        }

        button.danger {
            background: transparent;
            color: #ff4444;
            border-color: #ff4444;
        }

        button.tab {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-bottom: 2px solid var(--border);
            border-radius: 0;
        }

        button.tab.active {
            color: var(--text);
            border-bottom: 2px solid var(--text);
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        input:focus, textarea:focus {
            border-color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grind-item {
            display: flex;
            flex-direction: column;
            padding: 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s;
        }

        .grind-item:active {
            border-color: var(--text-muted);
        }

        .grind-item.completed {
            opacity: 0.6;
            border-color: var(--border);
        }

        .grind-item.completed .item-title {
            text-decoration: line-through;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 1.05rem;
        }

        .item-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag {
            font-size: 0.65rem;
            padding: 3px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        /* Checkbox styling */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .completed .custom-checkbox {
            background: var(--text);
        }

        .custom-checkbox::after {
            content: '';
            width: 10px;
            height: 5px;
            border-left: 2px solid var(--bg);
            border-bottom: 2px solid var(--bg);
            transform: rotate(-45deg) translateY(-2px);
            opacity: 0;
        }

        .completed .custom-checkbox::after {
            opacity: 1;
        }

        /* Detail Modal */
        #detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #detail-modal.open {
            transform: translateX(0);
        }

        .modal-header {
            height: var(--header-height);
            padding: env(safe-area-inset-top) 20px 0;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            gap: 15px;
        }

        /* Back Button */
        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            padding: 0;
            flex-shrink: 0;
        }

        .back-btn:active {
            background: var(--surface-hover);
            border-color: var(--text-muted);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* Exercise List inside Workout */
        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .exercise-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .exercise-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .exercise-reps {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Meal Detail Image */
        .meal-image {
            width: 100%;
            height: 200px;
            background: var(--surface);
            border-radius: var(--radius);
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .meal-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Misc */
        .tab-group { display: flex; margin-bottom: 20px; gap: 0; }

        /* Dynamic Quote card styles with gradient background support */
        .gradient-quote-card {
            border-radius: var(--radius);
            margin-bottom: 15px;
            border: 1px solid var(--border);
            padding: 25px 20px;
        }

        .gradient-quote-text {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.45;
            color: #ffffff;
            font-style: italic;
        }

        /* Loader */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Input group fixed sizing */
        .input-group {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-top: 15px;
        }

        .input-group input {
            margin: 0;
            flex: 1;
        }

        .input-group button {
            margin: 0;
            width: auto;
            padding: 0 25px;
        }

        /* Home Video Segment */
        .home-video-wrapper {
            width: 100%;
            height: 420px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Hype View */
        #view-hype { padding: 0; overflow-y: scroll; scroll-snap-type: y mandatory; height: calc(100vh - var(--header-height) - var(--nav-height)); }
        .video-container { height: 100%; width: 100%; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>PARADE</h1>
            <div class="stats">
                <div id="stat-streak">🔥 0</div>
            </div>
        </header>

        <main id="main-scrollable">
            <!-- HOME VIEW (Dynamic Long Scroll Feed) -->
            <div id="view-home" class="view active">
                <h2>TODAY'S GRIND</h2>
                <div class="task-list" id="home-tasks" style="margin-top: 15px; margin-bottom: 25px;">
                    <!-- Injected via JS -->
                </div>

                <!-- Dynamic Scattered Content Feed -->
                <div id="home-scattered-feed">
                    <!-- Randomly mixed quotes, tips, meals, and video embeds are injected here dynamically -->
                </div>
            </div>

            <!-- PLAN VIEW -->
            <div id="view-plan" class="view">
                <h2>TRAINING LAB</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Build your arsenal.</p>
                
                <div class="tab-group">
                    <button class="tab active" id="tab-btn-ai" onclick="switchPlanMode('ai')">AI GENERATOR</button>
                    <button class="tab" id="tab-btn-manual" onclick="switchPlanMode('manual')">CUSTOM BUILDER</button>
                </div>

                <!-- AI Mode -->
                <div id="plan-mode-ai">
                    <div class="card">
                        <h3>FOCUS AREA</h3>
                        <input type="text" id="ai-prompt" placeholder="e.g. Explosiveness, shooting form, post moves...">
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                            <button class="secondary" onclick="generateAI('workout')">
                                <span>WORKOUT</span><div class="loader" id="ldr-workout"></div>
                            </button>
                            <button class="secondary" onclick="generateAI('drill')">
                                <span>DRILLS</span><div class="loader" id="ldr-drill"></div>
                            </button>
                            <button class="secondary" onclick="generateAI('meal')" style="grid-column: span 2;">
                                <span>MEAL PLAN</span><div class="loader" id="ldr-meal"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Manual Mode -->
                <div id="plan-mode-manual" style="display: none;">
                    <div class="card" style="margin-bottom: 10px;">
                        <h3>TYPE</h3>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="secondary tab-btn active" id="btn-type-task" onclick="setManualType('task')">TASK</button>
                            <button class="secondary tab-btn" id="btn-type-workout" onclick="setManualType('workout')">WORKOUT</button>
                        </div>
                    </div>

                    <div class="card">
                        <h3>DETAILS</h3>
                        <label style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; display:block;">TITLE</label>
                        <input type="text" id="manual-title" placeholder="e.g. 500 made threes">
                        
                        <div id="manual-exercises-block" style="display: none;">
                            <label style="font-size: 0.8rem; color: var(--text-muted); display:block;">EXERCISES (ONE PER LINE, FORMAT: NAME - SETS x REPS)</label>
                            <textarea id="manual-exercises" placeholder="Squats - 3 x 10&#10;Pushups - 4 x 25"></textarea>
                        </div>
                        
                        <button onclick="addManualItem()" style="margin-top: 10px;">ADD TO GRIND</button>
                    </div>
                </div>
            </div>

            <!-- HYPE VIEW -->
            <div id="view-hype" class="view">
                <!-- Injected via JS -->
            </div>

            <!-- SETTINGS VIEW -->
            <div id="view-settings" class="view">
                <h2>SETTINGS</h2>
                
                <div class="card" style="margin-top: 15px;">
                    <h3>API KEY (GEMINI)</h3>
                    <div class="input-group">
                        <input type="text" id="api-key-input" placeholder="Enter Gemini API Key" style="margin: 0;">
                        <button onclick="saveSettings()">SAVE</button>
                    </div>
                </div>

                <div class="card" style="margin-top: 15px;">
                    <h3>SYSTEM</h3>
                    <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">Refresh the application to reload video streams and sync schedules.</p>
                    <button class="secondary" onclick="window.location.reload()">REFRESH APP</button>
                </div>

                <button class="danger" onclick="clearData()" style="margin-top: 20px;">RESET ALL DATA</button>
            </div>
        </main>

        <nav>
            <div class="nav-item active" onclick="switchView('home', this)">
                <span class="material-symbols-outlined">home</span>
            </div>
            <div class="nav-item" onclick="switchView('plan', this)">
                <span class="material-symbols-outlined">fitness_center</span>
            </div>
            <div class="nav-item" onclick="switchView('hype', this)">
                <span class="material-symbols-outlined">bolt</span>
            </div>
            <div class="nav-item" onclick="switchView('settings', this)">
                <span class="material-symbols-outlined">settings</span>
            </div>
        </nav>

        <!-- Detail Modal -->
        <div id="detail-modal">
            <div class="modal-header">
                <button class="back-btn" onclick="closeDetail()" aria-label="Back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <h2 id="modal-title" class="modal-title" style="flex:1; text-align:center; padding-right: 40px; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">DETAIL</h2>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

            { title: "FOOTWORK: THE TRIPLE THREAT", content: "Master the jab step. A quick, aggressive jab step can freeze your defender, opening up clean space for a shot or drive." },
            { title: "FINISHING: THE SAME-FOOT LAYUP", content: "Finish off your wrong foot (e.g., right hand, right foot) to throw off the rim protector's shot-blocking timing." },
            { title: "HUSTLE: THE 50/50 BALLS", content: "Chasing down loose balls and rebounds takes zero talent. Be the player who acts first on every deflection." },
            { title: "SPACING: FILL THE CORNERS", content: "Great floor spacing creates drive lanes. When running in transition, sprint to the corners to pull defenders away from the paint." },
            { title: "DEFENSE: THE ACTIVE HANDS", content: "Never defend with your hands down. Keep one hand mirroring the ball and the other hand blocking the passing lane." }
        ];

        function init() {
            document.getElementById('api-key-input').value = state.apiKey;
            checkStreak();
            updateStatsUI();
            renderTasks();
            loadVideos();
        }

        // Core System
        function checkStreak() {
            const today = new Date().toDateString();
            if (state.lastActive !== today) {
                const lastDate = new Date(state.lastActive);
                const currDate = new Date(today);
                const diffTime = Math.abs(currDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

                if (diffDays === 1) {
                    state.streak++;
                } else if (diffDays > 1) {
                    state.streak = 0;
                    alert("Streak lost! Back to the grind.");
                }
                
                state.lastActive = today;
                state.tasks.forEach(t => {
                    t.completed = false;
                    if(t.exercises) t.exercises.forEach(e => e.done = false);
                });
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem('parade_streak', state.streak);
            localStorage.setItem('parade_apikey', state.apiKey);
            localStorage.setItem('parade_last_active', state.lastActive);
            localStorage.setItem('parade_tasks', JSON.stringify(state.tasks));
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('stat-streak').innerText = `🔥 ${state.streak}`;
        }

        function clearData() {
            if(confirm("Reset all progress? This cannot be undone.")) {
                localStorage.clear();
                location.reload();
            }
        }

        // View Nav
        function switchView(viewId, el) {
            document.querySelectorAll('main > .view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            el.classList.add('active');

            if (viewId === 'home') {
                renderScatteredFeed(globalVideoLines);
                document.getElementById('main-scrollable').scrollTop = 0;
            }
        }

        function switchPlanMode(mode) {
            document.getElementById('plan-mode-ai').style.display = mode === 'ai' ? 'block' : 'none';
            document.getElementById('plan-mode-manual').style.display = mode === 'manual' ? 'block' : 'none';
            document.getElementById('tab-btn-ai').classList.toggle('active', mode === 'ai');
            document.getElementById('tab-btn-manual').classList.toggle('active', mode === 'manual');
        }

        function setManualType(type) {
            manualType = type;
            document.getElementById('btn-type-task').classList.toggle('active', type === 'task');
            document.getElementById('btn-type-workout').classList.toggle('active', type === 'workout');
            document.getElementById('manual-exercises-block').style.display = type === 'workout' ? 'block' : 'none';
        }

        // Render Today's Grind Task Cards
        function renderTasks() {
            const list = document.getElementById('home-tasks');
            list.innerHTML = '';
            
            if(state.tasks.length === 0) {
                list.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding: 20px;">No grind set for today. Go to the Lab.</p>`;
                return;
            }

            state.tasks.forEach(task => {
                const el = document.createElement('div');
                el.className = `grind-item ${task.completed ? 'completed' : ''}`;
                
                let meta = '';
                if (task.type === 'workout' || task.type === 'drill') {
                    const total = task.exercises.length;
                    const done = task.exercises.filter(e => e.done).length;
                    meta = `${done}/${total} exercises done`;
                } else if (task.type === 'meal') {
                    meta = `${task.calories || '???'} kcal | ${task.protein || '???'} protein`;
                }

                const tagColor = task.type === 'meal' ? '#ff8c00' : task.type === 'workout' ? '#ff3333' : task.type === 'drill' ? '#3388ff' : '#aaaaaa';

                el.innerHTML = `
                    <div class="item-header">
                        <div class="checkbox-wrapper">
                            <div class="custom-checkbox" onclick="event.stopPropagation(); toggleTaskFast(${task.id})"></div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <span class="item-title">${task.title}</span>
                                <div style="display:flex; gap:8px; align-items:center;">
                                    <span class="tag" style="color:${tagColor}; border-color:${tagColor}">${task.type}</span>
                                    <span class="item-meta">${meta}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                el.onclick = () => openDetail(task.id);
                list.appendChild(el);
            });
        }

        // Shuffling Algorithm guaranteeing absolutely no adjacent duplicate types in long scroll home feed
        function shuffleNoAdjacent(items) {
            let attempts = 0;
            while (attempts < 150) {
                let shuffled = [...items].sort(() => 0.5 - Math.random());
                let valid = true;
                for (let i = 0; i < shuffled.length - 1; i++) {
                    if (shuffled[i].type === shuffled[i+1].type) {
                        valid = false;
                        break;
                    }
                }
                if (valid) {
                    return shuffled;
                }
                attempts++;
            }
            return items.sort(() => 0.5 - Math.random()); // Fallback
        }

        // Beautiful, Shuffled Home Feed Construction with 3 videos and 3 tips
        function renderScatteredFeed(videoLines) {
            const feedContainer = document.getElementById('home-scattered-feed');
            feedContainer.innerHTML = '';

            let itemsPool = [];

            // 1. Pick 3 random videos from the playlist, muted on home page
            if (videoLines && videoLines.length > 0) {
                let shuffledVids = [...videoLines].sort(() => 0.5 - Math.random());
                shuffledVids.slice(0, 3).forEach(url => {
                    let embedUrl = extractYouTubeEmbed(url.trim(), true, true); // Autoplay, Muted on Home Page
                    if (embedUrl) {
                        itemsPool.push({
                            type: 'video',
                            content: `<div class="home-video-wrapper">
                                <iframe src="${embedUrl}" style="width:100%; height:100%;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>`
                        });
                    }
                });
            }

            // 2. Pick 1 random Meal
            const stateMeals = state.tasks.filter(t => t.type === 'meal');
            const mealPool = stateMeals.length > 0 ? stateMeals : defaultMeals;
            const randomMeal = mealPool[Math.floor(Math.random() * mealPool.length)];
            const mealImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent((randomMeal.imagePrompt || randomMeal.title) + ' photorealistic healthy food portrait')}?width=800&height=600&nologo=true`;
            
            itemsPool.push({
                type: 'meal',
                content: `
                    <div class="card" onclick="openDetail(${randomMeal.id})">
                        <span class="tag" style="color: #ff8c00; border-color: #ff8c00; margin-bottom: 12px; display: inline-block;">MEAL PLAN</span>
                        <h3 class="item-title" style="margin-bottom: 10px;">${randomMeal.title}</h3>
                        <img src="${mealImgUrl}" class="meal-image" style="height: 180px; margin-bottom: 12px;" alt="${randomMeal.title}" loading="lazy">
                        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.4; margin-bottom: 10px;">${randomMeal.description}</p>
                        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.85rem;">
                            <span>CALORIES: <span style="color:var(--text-muted); font-weight:400;">${randomMeal.calories || '650'}</span></span>
                            <span>PROTEIN: <span style="color:var(--text-muted); font-weight:400;">${randomMeal.protein || '45g'}</span></span>
                        </div>
                    </div>
                `
            });

            // 3. Pick 2 random Quotes with gradient backgrounds
            let shuffledQuotes = [...quotes].sort(() => 0.5 - Math.random());
            const gradients = [
                'linear-gradient(135deg, #1c0024 0%, #030303 100%)',
                'linear-gradient(135deg, #2b0c02 0%, #030303 100%)',
                'linear-gradient(135deg, #00122e 0%, #030303 100%)',
                'linear-gradient(135deg, #02200a 0%, #030303 100%)',
                'linear-gradient(135deg, #1f1f1f 0%, #030303 100%)'
            ];
            
            shuffledQuotes.slice(0, 2).forEach((quote) => {
                const randGradient = gradients[Math.floor(Math.random() * gradients.length)];
                itemsPool.push({
                    type: 'quote',
                    content: `
                        <div class="gradient-quote-card" style="background: ${randGradient};">
                            <span class="tag" style="color: var(--text-muted); border-color: var(--text-muted); margin-bottom: 12px; display: inline-block;">MOTIVATION</span>
                            <p class="gradient-quote-text">${quote}</p>
                        </div>
                    `
                });
            });

            // 4. Pick 3 random Tips
            let shuffledTips = [...proTips].sort(() => 0.5 - Math.random());
            shuffledTips.slice(0, 3).forEach(tip => {
                itemsPool.push({
                    type: 'tip',
                    content: `
                        <div class="card">
                            <span class="tag" style="color: #3388ff; border-color: #3388ff; margin-bottom: 12px; display: inline-block;">TIP</span>
                            <h3 style="font-size: 1.1rem; color: var(--text); margin-bottom: 8px;">${tip.title}</h3>
                            <p class="pro-tip-content" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;">${tip.content}</p>
                        </div>
                    `
                });
            });

            // Re-sort items pool to guarantee absolutely NO adjacent duplicate types
            let finalNoAdjacentPool = shuffleNoAdjacent(itemsPool);

            // Render to container
            finalNoAdjacentPool.forEach(item => {
                const div = document.createElement('div');
                div.innerHTML = item.content;
                feedContainer.appendChild(div);
            });
        }

        // Detail Modal Logic
        function openDetail(id) {
            currentActiveItem = state.tasks.find(t => t.id === id);
            if(!currentActiveItem) {
                currentActiveItem = defaultMeals.find(t => t.id === id);
            }
            if(!currentActiveItem) return;

            document.getElementById('modal-title').innerText = currentActiveItem.title;
            const body = document.getElementById('modal-body');
            body.innerHTML = '';

            let html = '';

            if (currentActiveItem.type === 'workout' || currentActiveItem.type === 'drill') {
                if (currentActiveItem.description) {
                    html += `<p class="meal-desc">${currentActiveItem.description}</p>`;
                }
                html += `<div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:0 15px; margin-bottom: 20px;">`;
                currentActiveItem.exercises.forEach((ex, idx) => {
                    html += `
                        <div class="exercise-item" onclick="toggleExercise(${idx})" style="cursor:pointer; border-bottom:${idx===currentActiveItem.exercises.length-1 ? 'none' : '1px solid var(--border)'}">
                            <div class="checkbox-wrapper" style="pointer-events:none;">
                                <div class="custom-checkbox" style="background:${ex.done ? 'var(--text)' : 'transparent'};">
                                    <div style="width:10px; height:5px; border-left:2px solid var(--bg); border-bottom:2px solid var(--bg); transform:rotate(-45deg) translateY(-2px); opacity:${ex.done?1:0}"></div>
                                </div>
                                <div class="exercise-info">
                                    <span class="exercise-name" style="${ex.done?'text-decoration:line-through; color:var(--text-muted)':''}">${ex.name}</span>
                                    <span class="exercise-reps">${ex.reps}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                
                const allDone = currentActiveItem.exercises.every(e => e.done);
                html += `<button onclick="completeCurrentItem()" ${allDone && currentActiveItem.completed ? 'style="opacity:0.5"' : ''}>
                    ${currentActiveItem.completed ? 'Completed' : 'Mark Full Workout Complete'}
                </button>`;

            } else if (currentActiveItem.type === 'meal') {
                if (currentActiveItem.imagePrompt) {
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentActiveItem.imagePrompt + ' photorealistic healthy food portrait')}?width=800&height=600&nologo=true`;
                    html += `<img src="${imgUrl}" class="meal-image" alt="Meal Image" loading="lazy">`;
                }
                if (currentActiveItem.description) {
                    html += `<p class="meal-desc">${currentActiveItem.description}</p>`;
                }
                
                html += `<div class="card" style="margin-bottom: 20px;">
                    <h3 style="margin-bottom:10px;">MACROS</h3>
                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.95rem;">
                        <span>CALORIES: <span style="color:var(--text-muted); font-weight:400;">${currentActiveItem.calories || 'N/A'}</span></span>
                        <span>PROTEIN: <span style="color:var(--text-muted); font-weight:400;">${currentActiveItem.protein || 'N/A'}</span></span>
                    </div>
                </div>`;

                // Display detailed ingredients if available
                if (currentActiveItem.ingredients && currentActiveItem.ingredients.length > 0) {
                    html += `<div class="card" style="margin-bottom: 20px;">
                        <h3 style="margin-bottom:10px;">INGREDIENTS</h3>
                        <ul style="list-style: disc; margin-left: 20px; color: var(--text-muted); line-height: 1.6; display: flex; flex-direction: column; gap: 4px;">
                            ${currentActiveItem.ingredients.map(ing => `<li style="text-transform: none;">${ing}</li>`).join('')}
                        </ul>
                    </div>`;
                }

                // Display detailed cooking instructions if available
                if (currentActiveItem.instructions && currentActiveItem.instructions.length > 0) {
                    html += `<div class="card" style="margin-bottom: 20px;">
                        <h3 style="margin-bottom:10px;">INSTRUCTIONS</h3>
                        <ol style="margin-left: 20px; color: var(--text-muted); line-height: 1.6; display: flex; flex-direction: column; gap: 8px;">
                            ${currentActiveItem.instructions.map(step => `<li style="text-transform: none;">${step}</li>`).join('')}
                        </ol>
                    </div>`;
                }

                html += `<button onclick="completeCurrentItem()" ${currentActiveItem.completed ? 'style="opacity:0.5"' : ''}>
                    ${currentActiveItem.completed ? 'Eaten' : 'Mark Meal Eaten'}
                </button>`;
            } else {
                html += `
                    <div style="padding: 40px 0; text-align:center;">
                        <h3 style="font-size:1.1rem; color:var(--text-muted);">BASIC TASK</h3>
                        <p style="margin-top:10px; font-size:1.2rem; font-weight:600;">${currentActiveItem.title}</p>
                    </div>
                    <button onclick="completeCurrentItem()">
                        ${currentActiveItem.completed ? 'Completed' : 'Mark Complete'}
                    </button>
                `;
            }

            if (currentActiveItem.id < 100) {
                html += `<button class="danger" style="margin-top:15px;" onclick="deleteCurrentItem()">Delete Item</button>`;
            }

            body.innerHTML = html;
            document.getElementById('detail-modal').classList.add('open');
        }

        function closeDetail() {
            document.getElementById('detail-modal').classList.remove('open');
            currentActiveItem = null;
            renderTasks();
        }

        function toggleExercise(idx) {
            if(!currentActiveItem || !currentActiveItem.exercises) return;
            currentActiveItem.exercises[idx].done = !currentActiveItem.exercises[idx].done;
            
            const allDone = currentActiveItem.exercises.every(e => e.done);
            if(allDone && !currentActiveItem.completed) {
                completeCurrentItem();
            } else if (!allDone && currentActiveItem.completed) {
                currentActiveItem.completed = false;
                saveState();
                openDetail(currentActiveItem.id);
            } else {
                saveState();
                openDetail(currentActiveItem.id);
            }
        }

        function completeCurrentItem() {
            if(!currentActiveItem) return;
            if(!currentActiveItem.completed) {
                currentActiveItem.completed = true;
                if(currentActiveItem.exercises) currentActiveItem.exercises.forEach(e => e.done = true);
                saveState();
            }
            closeDetail();
        }

        function deleteCurrentItem() {
            if(!currentActiveItem) return;
            if(confirm("Delete this item?")) {
                state.tasks = state.tasks.filter(t => t.id !== currentActiveItem.id);
                saveState();
                closeDetail();
            }
        }

        function toggleTaskFast(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if(task.completed) {
                    if(task.exercises) task.exercises.forEach(e => e.done = true);
                } else {
                    if(task.exercises) task.exercises.forEach(e => e.done = false);
                }
                saveState();
                renderTasks();
            }
        }

        function addManualItem() {
            const title = document.getElementById('manual-title').value.trim();
            if(!title) return;

            let item = { id: Date.now(), title, type: manualType, completed: false };

            if(manualType === 'workout') {
                const exText = document.getElementById('manual-exercises').value.trim();
                const exercises = [];
                exText.split('\n').forEach(line => {
                    if(line.trim()) {
                        const parts = line.split('-');
                        exercises.push({
                            name: parts[0] ? parts[0].trim() : 'Exercise',
                            reps: parts[1] ? parts[1].trim() : '3 x 10',
                            done: false
                        });
                    }
                });
                item.exercises = exercises.length ? exercises : [{name: "Workout Session", reps: "1 Session", done: false}];
            }

            state.tasks.push(item);
            saveState();
            
            document.getElementById('manual-title').value = '';
            document.getElementById('manual-exercises').value = '';
            alert("Added to Today's Grind!");
            renderTasks();
        }

        // AI Generation utilizing the requested gemini-3.1-flash-lite model
        async function generateAI(type) {
            if (!state.apiKey) {
                alert("Please add your Gemini API Key in Settings.");
                return;
            }

            const focus = document.getElementById('ai-prompt').value || "overall improvement";
            const btn = event.currentTarget;
            const span = btn.querySelector('span');
            const loader = btn.querySelector('.loader');

            let prompt = "";
            if (type === 'workout' || type === 'drill') {
                prompt = `You are an elite basketball trainer. Create a highly effective basketball ${type} focusing on: ${focus}.
                Return ONLY a raw JSON object (no markdown, no backticks, no code blocks) with this exact structure:
                {
                    "title": "Short Catchy Name",
                    "description": "1 sentence motivation",
                    "type": "${type}",
                    "exercises": [
                        { "name": "Exercise Name", "reps": "Sets x Reps/Time" },
                        { "name": "Exercise Name", "reps": "Sets x Reps/Time" }
                    ]
                }
                Include 3-5 exercises. Avoid using all uppercase in the values.`;
            } else if (type === 'meal') {
                prompt = `You are an elite sports nutritionist. Create a high-performance athlete meal focusing on: ${focus}.
                Return ONLY a raw JSON object (no markdown, no backticks, no code blocks) with this exact structure:
                {
                    "title": "Short Appetizing Name",
                    "description": "Short description of the meal.",
                    "type": "meal",
                    "calories": 600,
                    "protein": "40g",
                    "imagePrompt": "A single descriptive sentence for an AI image generator to create a picture of this meal on a nice plate",
                    "ingredients": ["100g Ingredient A", "1tbsp Ingredient B"],
                    "instructions": ["Step 1 cooked properly.", "Step 2 ready to serve."]
                }
                Avoid using all uppercase in the values.`;
            }

            span.style.display = 'none';
            loader.style.display = 'block';
            
            try {
                // Endpoint utilizes Google's model: gemini-3.1-flash-lite
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${state.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });
                
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                
                let resultObj = JSON.parse(text);
                
                const newTask = {
                    id: Date.now(),
                    title: resultObj.title || 'AI Generated Item',
                    description: resultObj.description || '',
                    type: resultObj.type || type,
                    completed: false
                };

                if(newTask.type === 'workout' || newTask.type === 'drill') {
                    newTask.exercises = (resultObj.exercises || []).map(e => ({
                        name: e.name || 'Exercise',
                        reps: e.reps || '3 x 10',
                        done: false
                    }));
                } else if (newTask.type === 'meal') {
                    newTask.calories = resultObj.calories;
                    newTask.protein = resultObj.protein;
                    newTask.imagePrompt = resultObj.imagePrompt || newTask.title;
                    newTask.ingredients = resultObj.ingredients || [];
                    newTask.instructions = resultObj.instructions || [];
                }

                state.tasks.push(newTask);
                saveState();
                renderTasks();
                alert(`${newTask.title} added to the grind!`);
                document.getElementById('ai-prompt').value = '';
                
            } catch (error) {
                alert("AI generation error: " + error.message);
                console.error(error);
            } finally {
                span.style.display = 'inline';
                loader.style.display = 'none';
            }
        }

        // Settings / Store
        function saveSettings() {
            state.apiKey = document.getElementById('api-key-input').value.trim();
            saveState();
            alert("API Key saved.");
        }

        // Hype Video Feed
        async function loadVideos() {
            const container = document.getElementById('view-hype');
            try {
                const res = await fetch('videos.txt');
                if (!res.ok) throw new Error("videos.txt not found");
                const text = await res.text();
                const lines = text.split('\n').filter(l => l.trim() !== '');

                if (lines.length === 0) throw new Error("Empty file");

                globalVideoLines = lines;

                lines.forEach((url) => {
                    // Mute=false for the dedicated Hype feed, letting sound play as requested [1.1]
                    let embedUrl = extractYouTubeEmbed(url.trim(), true, false); 
                    if (embedUrl) {
                        const div = document.createElement('div');
                        div.className = 'video-container';
                        div.innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        container.appendChild(div);
                    }
                });

                renderScatteredFeed(globalVideoLines);

            } catch (e) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); display: flex; flex-direction: column; justify-content: center; height: 100%;">
                    <h3 style="margin-bottom: 10px;">NO VIDEOS</h3>
                    <p style="font-size: 0.85rem; line-height: 1.5; text-transform:none;">Create a <b>videos.txt</b> file in the same folder with YouTube Shorts links on each line to view the hype feed.</p>
                </div>`;
                
                renderScatteredFeed([]);
            }
        }

        // Helper: YouTube Link extraction supporting autoplay loop muting playsinline rules
        function extractYouTubeEmbed(url, autoplay = false, mute = false) {
            let videoId = null;
            if (url.includes('shorts/')) {
                videoId = url.split('shorts/')[1].split('?')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            }
            if (!videoId) return null;
            
            let params = `loop=1&playlist=${videoId}&controls=0&modestbranding=1&playsinline=1&rel=0`;
            if (autoplay) {
                params += `&autoplay=1`;
            }
            if (mute) {
                params += `&mute=1`; // Required by modern iOS browsers to autoplay inline silently on the Home page
            } else {
                params += `&mute=0`; // Play sound in HYPE feed as requested
            }
            return `https://www.youtube.com/embed/${videoId}?${params}`;
        }

        window.onload = init;
    </script>
