<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>daydream</title>
  
  <!-- Roboto & Roboto Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Synchronous QR Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <!-- Pure JS QR Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- Pako Deflate/Inflate (Universal Legacy Support & Level 9 Super Deflate) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      text-transform: lowercase;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'Roboto Mono', monospace;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    /* Left-Aligned Big Text Navigation (No Tabs) */
    .nav-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      gap: 22px;
      margin-bottom: 22px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      font-size: 1.85rem;
      font-weight: 700;
      color: #4a4a4a;
      cursor: pointer;
      padding: 0;
      text-align: left;
      line-height: 1;
      letter-spacing: -0.5px;
      transition: color 0.12s ease;
    }

    .nav-btn.active {
      color: #ffffff;
    }

    /* Container Panels */
    .view-panel {
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .view-panel.active {
      display: flex;
    }

    .box {
      border: 1px solid #222222;
      background: #000000;
      padding: 14px;
    }

    .file-zone {
      border: 1px dashed #333333;
      padding: 24px;
      text-align: center;
      cursor: pointer;
    }

    .file-zone:hover {
      border-color: #ffffff;
    }

    .file-input {
      display: none;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #888888;
      margin-bottom: 8px;
    }

    .field-row:last-child {
      margin-bottom: 0;
    }

    select, input[type="range"] {
      background: #000000;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 4px 6px;
      font-size: 0.8rem;
      outline: none;
    }

    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 1px solid #222222;
      padding: 18px;
    }

    #qrCanvas {
      width: 290px;
      height: 290px;
      display: block;
      background: #ffffff;
    }

    .metrics {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }

    .metric-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: #1a1a1a;
      overflow: hidden;
      margin: 4px 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      font-size: 0.98rem;
      line-height: 1.2;
      font-weight: 700;
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-outline {
      background: #000000;
      color: #ffffff;
      border: 1px solid #282828;
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    /* Receiver view */
    .camera-box {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      background: #000000;
      border: 1px solid #222222;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .target-box {
      position: absolute;
      top: 12.5%;
      left: 12.5%;
      width: 75%;
      height: 75%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      pointer-events: none;
      transition: border-color 0.05s ease;
    }

    #heatmapCanvas {
      width: 100%;
      height: 32px;
      background: #080808;
      border: 1px solid #1a1a1a;
      display: block;
      margin-top: 6px;
    }

    .result-box {
      border: 1px solid #ffffff;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    #rxPreview {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #000000;
    }
  </style>
</head>
<body>

  <!-- Mode Selector -->
  <div class="nav-header">
    <button class="nav-btn active" id="navSend" onclick="setMode('send')">send</button>
    <button class="nav-btn" id="navRecv" onclick="setMode('recv')">receive</button>
  </div>

  <!-- ================= SEND MODE ================= -->
  <div class="view-panel active" id="sendPanel">
    <div class="file-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-weight: 700; margin-bottom: 4px;">drop file here or click to browse</div>
      <div style="font-size: 0.72rem; color: #666666;">supports all formats up to 3mb</div>
      <input type="file" id="fileInput" class="file-input" onchange="onFileChosen(event)" />
    </div>

    <!-- Combined Options & File Details Box -->
    <div class="box" id="optionsBox">
      <div class="field-row" id="fileInfoRow" style="display: none; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid #1a1a1a;">
        <span id="txName" style="color: #ffffff; font-weight: 700;">-</span>
        <span id="txSize" class="mono" style="color: #ffffff;">-</span>
      </div>

      <div class="field-row">
        <label for="compressSelect">compression</label>
        <select id="compressSelect" onchange="recomputeFile()">
          <option value="deflate" selected>deflate</option>
          <option value="super">super deflate</option>
          <option value="none">none (raw)</option>
        </select>
      </div>
      <div class="field-row" style="margin-top: 10px;">
        <label for="chunkSizeSelect">chunk payload size</label>
        <select id="chunkSizeSelect" onchange="recomputeFile()">
          <option value="180" selected>180 bytes (high reliability)</option>
          <option value="260">260 bytes (balanced)</option>
          <option value="380">380 bytes (dense)</option>
        </select>
      </div>
      <div class="field-row" style="margin-top: 10px;">
        <label for="fpsInput">burst speed: <span id="fpsNum" class="mono">8</span> fps</label>
        <input type="range" id="fpsInput" min="4" max="20" value="8" oninput="onSpeedChange(this.value)" />
      </div>
    </div>

    <div class="stage">
      <canvas id="qrCanvas" width="300" height="300"></canvas>
    </div>

    <div class="box metrics">
      <div class="metric-line">
        <span id="txStatus">idle</span>
        <span id="txFrameCount" class="mono">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="txProgressBar"></div>
      </div>
      <div class="metric-line" style="color: #666666; font-size: 0.75rem;">
        <span id="txLoopCount" class="mono">loop: 0</span>
        <span id="txTimeLeft" class="mono">time left: --</span>
        <span id="txRate" class="mono">8 fps</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" id="btnToggleTx" onclick="handleStartStreamClick()" disabled>start stream</button>
      <button class="btn btn-outline" onclick="resetTx()">reset</button>
    </div>
  </div>

  <!-- ================= RECEIVE MODE ================= -->
  <div class="view-panel" id="recvPanel">
    <div class="camera-box">
      <video id="video" playsinline muted autoplay></video>
      <div class="target-box" id="targetBox"></div>
    </div>

    <div class="box metrics">
      <div class="metric-line">
        <span id="rxStatus">camera inactive</span>
        <span id="rxProgressPct" class="mono">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="rxProgressBar"></div>
      </div>
      <div class="metric-line" style="color: #666666; font-size: 0.75rem;">
        <span id="rxChunkCount" class="mono">chunks: 0 / 0</span>
        <span id="rxMissingCount" class="mono">missing: 0</span>
      </div>
      <canvas id="heatmapCanvas"></canvas>
      <button class="btn btn-outline" id="btnDownloadPartial" onclick="downloadUnfinished()" style="display: none; margin-top: 10px; width: 100%;">
        download unfinished (0%)
      </button>
    </div>

    <div class="result-box" id="rxSuccessBox">
      <div style="font-weight: 700;">transfer complete</div>
      <div id="rxFileName" style="font-size: 0.8rem; color: #888888;">-</div>
      <div id="rxPreview"></div>
      <div class="btn-group">
        <a class="btn" id="rxDownloadBtn" href="#" download="">save file</a>
        <button class="btn btn-outline" onclick="resetRx()">reset</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" id="btnCamToggle" onclick="startCamera()">start camera</button>
      <button class="btn btn-outline" id="btnFlip" onclick="flipCamera()" disabled>switch</button>
      <button class="btn btn-outline" id="btnRxReset" onclick="resetRx()">reset</button>
    </div>
  </div>

  <script>
    /* ========================================================
       CORE & LEGACY UTILITIES
    ======================================================== */
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 b';
      var k = 1024;
      var units = ['b', 'kb', 'mb', 'gb'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + units[i];
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec <= 0) return '0s';
      if (sec < 60) return sec + 's';
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return m + 'm ' + (s < 10 ? '0' : '') + s + 's';
    }

    function crc32(u8) {
      var table = [];
      for (var i = 0; i < 256; i++) {
        var c = i;
        for (var k = 0; k < 8; k++) {
          c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
        }
        table[i] = c;
      }
      var crc = 0 ^ (-1);
      for (var j = 0; j < u8.length; j++) {
        crc = (crc >>> 8) ^ table[(crc ^ u8[j]) & 0xFF];
      }
      return (crc ^ (-1)) >>> 0;
    }

    function u8ToBase64(u8) {
      var s = '';
      var step = 8192;
      for (var i = 0; i < u8.length; i += step) {
        s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + step, u8.length)));
      }
      return btoa(s);
    }

    function base64ToU8(b64) {
      var s = atob(b64);
      var u8 = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) {
        u8[i] = s.charCodeAt(i);
      }
      return u8;
    }

    // Legacy File Reader fallback for Safari < 14 and older browsers
    function readFileBuffer(file) {
      return new Promise(function(resolve, reject) {
        if (file.arrayBuffer) {
          file.arrayBuffer().then(function(buf) {
            resolve(new Uint8Array(buf));
          }).catch(reject);
        } else {
          var reader = new FileReader();
          reader.onload = function(e) {
            resolve(new Uint8Array(e.target.result));
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        }
      });
    }

    // Cross-browser Deflate (Pako + Stream Fallback + Level 9 Super Deflate)
    async function compressPayload(u8, mode) {
      if (mode === 'none') return { data: u8, comp: false };
      var level = (mode === 'super') ? 9 : 6;

      if (typeof pako !== 'undefined') {
        try {
          var comp = pako.deflate(u8, { level: level });
          if (comp.length < u8.length) {
            return { data: comp, comp: true };
          }
        } catch (e) {
          console.warn('pako compression error:', e);
        }
      }

      if (typeof CompressionStream !== 'undefined') {
        try {
          var cs = new CompressionStream('deflate');
          var res = new Response(new Blob([u8]).stream().pipeThrough(cs));
          var compBuf = new Uint8Array(await res.arrayBuffer());
          if (compBuf.length < u8.length) {
            return { data: compBuf, comp: true };
          }
        } catch (e) {}
      }

      return { data: u8, comp: false };
    }

    // Cross-browser Decompression (Pako + Stream Fallback)
    async function decompressPayload(u8, isComp) {
      if (!isComp) return u8;

      if (typeof pako !== 'undefined') {
        try {
          return pako.inflate(u8);
        } catch (e) {
          console.warn('pako decompression error:', e);
        }
      }

      if (typeof DecompressionStream !== 'undefined') {
        try {
          var ds = new DecompressionStream('deflate');
          var res = new Response(new Blob([u8]).stream().pipeThrough(ds));
          return new Uint8Array(await res.arrayBuffer());
        } catch (e) {}
      }

      return u8;
    }

    function setMode(mode) {
      document.getElementById('sendPanel').classList.toggle('active', mode === 'send');
      document.getElementById('recvPanel').classList.toggle('active', mode === 'recv');
      document.getElementById('navSend').classList.toggle('active', mode === 'send');
      document.getElementById('navRecv').classList.toggle('active', mode === 'recv');

      if (mode === 'recv') {
        pauseBroadcast();
      } else {
        stopCamera();
      }
    }

    /* ========================================================
       SENDER LOGIC (AUTO-ADAPTIVE >400KB & CLEAN TIMING)
    ======================================================== */
    var rawFileData = null;
    var selectedFileObj = null;
    var baseMetaPacket = null;
    var baseDataPackets = [];
    var packetSchedule = [];
    var scheduleCursor = 0;
    var isBroadcasting = false;
    var broadcastTimer = null;
    var countdownTimer = null;
    var currentFps = 8;
    var loopCounter = 1;

    async function onFileChosen(e) {
      var file = e.target.files[0];
      if (!file) return;

      selectedFileObj = file;
      rawFileData = await readFileBuffer(file);

      // Adapt dynamically to large files above 400KB
      if (rawFileData.length > 400 * 1024) {
        var adaptedChunk = rawFileData.length > 1024 * 1024 ? 380 : 260;
        var adaptedFps = rawFileData.length > 1024 * 1024 ? 12 : 10;
        document.getElementById('chunkSizeSelect').value = String(adaptedChunk);
        document.getElementById('fpsInput').value = String(adaptedFps);
        currentFps = adaptedFps;
        document.getElementById('fpsNum').textContent = String(adaptedFps);
        document.getElementById('txRate').textContent = adaptedFps + ' fps';
      }

      await buildPackets();
    }

    async function buildPackets() {
      if (!rawFileData || !selectedFileObj) return;

      pauseBroadcast();
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      var compSetting = document.getElementById('compressSelect').value;
      var compResult = await compressPayload(rawFileData, compSetting);
      var workingPayload = compResult.data;
      var wasCompressed = compResult.comp;

      // Integrated file and size readout with compression effect
      document.getElementById('fileInfoRow').style.display = 'flex';
      document.getElementById('txName').textContent = selectedFileObj.name.toLowerCase();
      document.getElementById('txSize').textContent = wasCompressed 
        ? formatBytes(selectedFileObj.size) + ' -> ' + formatBytes(workingPayload.length)
        : formatBytes(selectedFileObj.size);

      var chunkSize = parseInt(document.getElementById('chunkSizeSelect').value) || 180;
      var totalChunks = Math.ceil(workingPayload.length / chunkSize);
      var fileId = Math.random().toString(36).substring(2, 6);
      var fileCrc = crc32(rawFileData);

      baseMetaPacket = 'ab0|' + fileId + '|' + totalChunks + '|' + selectedFileObj.size + '|' + (wasCompressed ? 1 : 0) + '|' + fileCrc + '|' + encodeURIComponent(selectedFileObj.type || 'application/octet-stream') + '|' + encodeURIComponent(selectedFileObj.name);

      baseDataPackets = [];
      for (var i = 0; i < totalChunks; i++) {
        var slice = workingPayload.subarray(i * chunkSize, (i + 1) * chunkSize);
        baseDataPackets.push('ab|' + fileId + '|' + (i + 1) + '|' + totalChunks + '|' + u8ToBase64(slice));
      }

      loopCounter = 1;
      constructSchedule(false);

      scheduleCursor = 0;
      drawFrameToCanvas(packetSchedule[0], 'qrCanvas');
      updateTxStats();

      var btn = document.getElementById('btnToggleTx');
      btn.disabled = false;
      btn.textContent = 'start stream';
      document.getElementById('txStatus').textContent = 'ready';
    }

    function constructSchedule(reverseOrder) {
      packetSchedule = [];
      packetSchedule.push(baseMetaPacket);

      var packets = reverseOrder ? baseDataPackets.slice().reverse() : baseDataPackets;

      for (var i = 0; i < packets.length; i++) {
        packetSchedule.push(packets[i]);
        if ((i + 1) % 10 === 0 && i !== packets.length - 1) {
          packetSchedule.push(baseMetaPacket);
        }
      }
    }

    function recomputeFile() {
      if (rawFileData) buildPackets();
    }

    function onSpeedChange(val) {
      currentFps = parseInt(val);
      document.getElementById('fpsNum').textContent = val;
      document.getElementById('txRate').textContent = val + ' fps';
      updateTxStats();
      if (isBroadcasting) {
        clearInterval(broadcastTimer);
        broadcastTimer = setInterval(tickBroadcast, 1000 / currentFps);
      }
    }

    function handleStartStreamClick() {
      var btn = document.getElementById('btnToggleTx');

      if (isBroadcasting) {
        pauseBroadcast();
        return;
      }

      if (broadcastTimer) {
        isBroadcasting = true;
        btn.textContent = 'pause stream';
        document.getElementById('txStatus').textContent = 'streaming';
        broadcastTimer = setInterval(tickBroadcast, 1000 / currentFps);
        return;
      }

      scheduleCursor = 0;
      loopCounter = 1;
      constructSchedule(false);
      drawFrameToCanvas(packetSchedule[0], 'qrCanvas');
      updateTxStats();

      btn.disabled = true;
      var countdown = 2;
      document.getElementById('txStatus').textContent = 'starting in ' + countdown + 's...';

      clearInterval(countdownTimer);
      countdownTimer = setInterval(function() {
        countdown--;
        if (countdown > 0) {
          document.getElementById('txStatus').textContent = 'starting in ' + countdown + 's...';
          updateTxStats(countdown);
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          isBroadcasting = true;
          btn.disabled = false;
          btn.textContent = 'pause stream';
          document.getElementById('txStatus').textContent = 'streaming';
          broadcastTimer = setInterval(tickBroadcast, 1000 / currentFps);
        }
      }, 1000);
    }

    function pauseBroadcast() {
      isBroadcasting = false;
      if (broadcastTimer) {
        clearInterval(broadcastTimer);
      }
      var btn = document.getElementById('btnToggleTx');
      if (packetSchedule.length > 0) {
        btn.textContent = 'resume stream';
        document.getElementById('txStatus').textContent = 'paused';
      }
    }

    function tickBroadcast() {
      if (packetSchedule.length === 0) return;
      scheduleCursor++;
      if (scheduleCursor >= packetSchedule.length) {
        scheduleCursor = 0;
        loopCounter++;
        constructSchedule(loopCounter % 2 === 0);
      }
      drawFrameToCanvas(packetSchedule[scheduleCursor], 'qrCanvas');
      updateTxStats();
    }

    function drawFrameToCanvas(content, canvasId) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var width = canvas.width;

      try {
        var qr = qrcode(0, 'M');
        qr.addData(content);
        qr.make();
        var modCount = qr.getModuleCount();
        var quietZone = 4;
        var cellSize = Math.floor(width / (modCount + quietZone * 2));
        var margin = Math.floor((width - cellSize * modCount) / 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, width);
        ctx.fillStyle = '#000000';

        for (var r = 0; r < modCount; r++) {
          for (var c = 0; c < modCount; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(margin + c * cellSize, margin + r * cellSize, cellSize, cellSize);
            }
          }
        }
      } catch (err) {
        console.error('qr draw error:', err);
      }
    }

    function updateTxStats(countdownOverride) {
      var total = packetSchedule.length || 1;
      document.getElementById('txFrameCount').textContent = (scheduleCursor + 1) + ' / ' + total;
      var pct = Math.floor(((scheduleCursor + 1) / total) * 100);
      document.getElementById('txProgressBar').style.width = pct + '%';
      document.getElementById('txLoopCount').textContent = 'loop: ' + loopCounter;
      document.getElementById('txRate').textContent = currentFps + ' fps';

      var remainingSec = 0;
      if (countdownOverride) {
        remainingSec = Math.ceil(total / currentFps) + countdownOverride;
      } else if (isBroadcasting) {
        var remainingFrames = total - (scheduleCursor + 1);
        remainingSec = Math.ceil(remainingFrames / currentFps);
      } else {
        remainingSec = Math.ceil(total / currentFps);
      }

      document.getElementById('txTimeLeft').textContent = 'time left: ' + formatTime(remainingSec);
    }

    function resetTx() {
      pauseBroadcast();
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      broadcastTimer = null;
      rawFileData = null;
      selectedFileObj = null;
      packetSchedule = [];
      document.getElementById('fileInput').value = '';
      document.getElementById('fileInfoRow').style.display = 'none';
      document.getElementById('btnToggleTx').disabled = true;
      document.getElementById('btnToggleTx').textContent = 'start stream';
      document.getElementById('txProgressBar').style.width = '0%';
      document.getElementById('txFrameCount').textContent = '0 / 0';
      document.getElementById('txTimeLeft').textContent = 'time left: --';
      document.getElementById('txStatus').textContent = 'idle';
      var canvas = document.getElementById('qrCanvas');
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    /* ========================================================
       RECEIVER LOGIC (PARTIAL DOWNLOAD & BUFFER ASSEMBLY)
    ======================================================== */
    var videoStream = null;
    var cameraMode = 'environment';
    var scanLoopId = null;
    var nativeDetector = null;

    var rxFileId = null;
    var rxMeta = null;
    var rxChunks = [];
    var rxTotalExpected = 0;
    var rxReceivedCount = 0;
    var rxDone = false;

    var chunkHits = new Map();

    var cropCanvas = document.createElement('canvas');
    cropCanvas.width = 400;
    cropCanvas.height = 400;
    var cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

    async function checkNativeDetector() {
      if ('BarcodeDetector' in window) {
        try {
          var supported = await BarcodeDetector.getSupportedFormats();
          if (supported.includes('qr_code')) {
            nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
          }
        } catch (e) {
          nativeDetector = null;
        }
      }
    }
    checkNativeDetector();

    // Universal Legacy getUserMedia Wrapper
    function openMediaStream(constraints) {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }
      var legacyGUM = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
      if (legacyGUM) {
        return new Promise(function(resolve, reject) {
          legacyGUM.call(navigator, constraints, resolve, reject);
        });
      }
      return Promise.reject(new Error('camera API not supported on this device'));
    }

    async function startCamera() {
      try {
        var constraints = {
          video: { 
            facingMode: cameraMode, 
            width: { ideal: 1280 }, 
            height: { ideal: 720 },
            frameRate: { ideal: 30, min: 30 }
          },
          audio: false
        };

        videoStream = await openMediaStream(constraints);
        var video = document.getElementById('video');
        video.srcObject = videoStream;
        video.setAttribute('playsinline', 'true');
        await video.play();

        document.getElementById('btnCamToggle').textContent = 'stop camera';
        document.getElementById('btnCamToggle').onclick = stopCamera;
        document.getElementById('btnFlip').disabled = false;
        document.getElementById('rxStatus').textContent = 'tracking optical stream...';

        scanTick();
      } catch (err) {
        alert('camera access error: ' + err.message);
        document.getElementById('rxStatus').textContent = 'camera error';
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(function(t) { t.stop(); });
        videoStream = null;
      }
      if (scanLoopId) {
        cancelAnimationFrame(scanLoopId);
        scanLoopId = null;
      }
      document.getElementById('btnCamToggle').textContent = 'start camera';
      document.getElementById('btnCamToggle').onclick = startCamera;
      document.getElementById('btnFlip').disabled = true;
      document.getElementById('rxStatus').textContent = 'camera inactive';
    }

    function flipCamera() {
      cameraMode = cameraMode === 'environment' ? 'user' : 'environment';
      stopCamera();
      startCamera();
    }

    function resetRx() {
      rxFileId = null;
      rxMeta = null;
      rxChunks = [];
      rxTotalExpected = 0;
      rxReceivedCount = 0;
      rxDone = false;
      chunkHits.clear();

      document.getElementById('rxSuccessBox').style.display = 'none';
      document.getElementById('rxPreview').innerHTML = '';
      document.getElementById('btnDownloadPartial').style.display = 'none';
      document.getElementById('rxProgressPct').textContent = '0%';
      document.getElementById('rxProgressBar').style.width = '0%';
      document.getElementById('rxChunkCount').textContent = 'chunks: 0 / 0';
      document.getElementById('rxMissingCount').textContent = 'missing: 0';
      document.getElementById('rxStatus').textContent = videoStream ? 'tracking optical stream...' : 'camera inactive';

      drawHeatmap();

      if (videoStream && !scanLoopId) {
        scanLoopId = requestAnimationFrame(scanTick);
      }
    }

    async function scanTick() {
      var video = document.getElementById('video');
      if (video.readyState >= video.HAVE_CURRENT_DATA && !rxDone) {
        var detectedRaw = null;
        var vw = video.videoWidth;
        var vh = video.videoHeight;

        if (vw > 0 && vh > 0) {
          var cropSize = Math.floor(Math.min(vw, vh) * 0.75);
          var sx = Math.floor((vw - cropSize) / 2);
          var sy = Math.floor((vh - cropSize) / 2);

          cropCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 400, 400);

          if (nativeDetector) {
            try {
              var barcodes = await nativeDetector.detect(cropCanvas);
              if (barcodes.length > 0) {
                detectedRaw = barcodes[0].rawValue;
              }
            } catch (e) {}
          }

          if (!detectedRaw && window.jsQR) {
            var img = cropCtx.getImageData(0, 0, 400, 400);
            var res = jsQR(img.data, 400, 400, { inversionAttempts: 'dontInvert' });
            if (res && res.data) {
              detectedRaw = res.data;
            }
          }

          if (detectedRaw) {
            parsePacket(detectedRaw);
          }
        }
      }

      if (!rxDone && videoStream) {
        scanLoopId = requestAnimationFrame(scanTick);
      }
    }

    function parsePacket(str) {
      if (!str || (!str.startsWith('ab|') && !str.startsWith('ab0|'))) return;
      var parts = str.split('|');
      var type = parts[0];
      var fId = parts[1];

      var total = type === 'ab0' ? parseInt(parts[2]) : parseInt(parts[3]);
      if (!total || isNaN(total)) return;

      if (rxFileId !== fId) {
        rxFileId = fId;
        rxTotalExpected = total;
        rxChunks = new Array(total + 1).fill(null);
        rxReceivedCount = 0;
        rxMeta = null;
        rxDone = false;
        chunkHits.clear();
        document.getElementById('rxSuccessBox').style.display = 'none';
        document.getElementById('rxPreview').innerHTML = '';
        document.getElementById('btnDownloadPartial').style.display = 'none';
        updateRxStats();
        drawHeatmap();
      } else if (total > rxTotalExpected) {
        var oldChunks = rxChunks;
        rxTotalExpected = total;
        rxChunks = new Array(total + 1).fill(null);
        for (var i = 1; i < oldChunks.length; i++) {
          if (oldChunks[i]) rxChunks[i] = oldChunks[i];
        }
      }

      var packetKey = fId + ':' + (type === 'ab0' ? 'meta' : parts[2]);
      var hits = chunkHits.get(packetKey) || 0;

      if (hits >= 2) return;

      if (type === 'ab0' && !rxMeta) {
        rxMeta = {
          total: parseInt(parts[2]),
          size: parseInt(parts[3]),
          comp: parts[4] === '1',
          crc: parseInt(parts[5]),
          mime: decodeURIComponent(parts[6] || 'application/octet-stream'),
          name: decodeURIComponent(parts[7] || 'file')
        };
        document.getElementById('rxStatus').textContent = 'streaming: ' + rxMeta.name.toLowerCase();
      }

      if (type === 'ab') {
        var idx = parseInt(parts[2]);
        if (idx >= 1 && idx <= rxTotalExpected && !rxChunks[idx]) {
          rxChunks[idx] = base64ToU8(parts[4]);
          rxReceivedCount++;
          updateRxStats();
          drawHeatmap();

          if (rxReceivedCount >= rxTotalExpected && rxMeta && !rxDone) {
            assembleAndComplete();
          }
        }
      }

      chunkHits.set(packetKey, hits + 1);
      pulseReticle();
    }

    function pulseReticle() {
      var box = document.getElementById('targetBox');
      box.style.borderColor = '#ffffff';
      setTimeout(function() {
        box.style.borderColor = 'rgba(255, 255, 255, 0.4)';
      }, 60);
    }

    function updateRxStats() {
      var pct = Math.floor((rxReceivedCount / (rxTotalExpected || 1)) * 100);
      document.getElementById('rxProgressPct').textContent = pct + '%';
      document.getElementById('rxProgressBar').style.width = pct + '%';
      document.getElementById('rxChunkCount').textContent = 'chunks: ' + rxReceivedCount + ' / ' + rxTotalExpected;
      document.getElementById('rxMissingCount').textContent = 'missing: ' + (rxTotalExpected - rxReceivedCount);

      // Download Unfinished trigger when above 70%
      var partialBtn = document.getElementById('btnDownloadPartial');
      if (pct >= 70 && !rxDone) {
        partialBtn.style.display = 'block';
        partialBtn.textContent = 'download unfinished (' + pct + '%)';
      } else {
        partialBtn.style.display = 'none';
      }
    }

    function drawHeatmap() {
      var canvas = document.getElementById('heatmapCanvas');
      var ctx = canvas.getContext('2d');
      var w = canvas.width = canvas.clientWidth;
      var h = canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#080808';
      ctx.fillRect(0, 0, w, h);

      if (rxTotalExpected <= 0) return;

      var cols = Math.min(rxTotalExpected, 80);
      var rows = Math.ceil(rxTotalExpected / cols);
      var cellW = w / cols;
      var cellH = h / rows;

      for (var i = 1; i <= rxTotalExpected; i++) {
        var col = (i - 1) % cols;
        var row = Math.floor((i - 1) / cols);
        ctx.fillStyle = rxChunks[i] ? '#ffffff' : '#1a1a1a';
        ctx.fillRect(col * cellW, row * cellH, cellW - 0.5, cellH - 0.5);
      }
    }

    /* Download partial file stitched with zero-padding for missing blocks */
    async function downloadUnfinished() {
      if (rxReceivedCount === 0 || !rxTotalExpected) return;

      var sampleLen = 0;
      for (var i = 1; i <= rxTotalExpected; i++) {
        if (rxChunks[i]) {
          sampleLen = rxChunks[i].length;
          break;
        }
      }
      if (sampleLen === 0) sampleLen = 180;

      var totalLen = rxTotalExpected * sampleLen;
      var merged = new Uint8Array(totalLen);
      var offset = 0;

      for (var j = 1; j <= rxTotalExpected; j++) {
        if (rxChunks[j]) {
          merged.set(rxChunks[j], offset);
          offset += rxChunks[j].length;
        } else {
          offset += sampleLen; // Zero-pad missing chunks
        }
      }

      var finalBytes = merged.subarray(0, offset);
      var isComp = rxMeta && rxMeta.comp;

      if (isComp) {
        try {
          finalBytes = await decompressPayload(finalBytes, true);
        } catch (e) {
          console.warn('partial decompression failed, serving raw buffer', e);
        }
      }

      var mime = (rxMeta && rxMeta.mime) ? rxMeta.mime : 'application/octet-stream';
      var filename = (rxMeta && rxMeta.name) ? 'partial_' + rxMeta.name : 'partial_download';

      var blob = new Blob([finalBytes], { type: mime });
      var url = URL.createObjectURL(blob);

      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function assembleAndComplete() {
      rxDone = true;
      document.getElementById('rxStatus').textContent = 'verifying payload...';
      document.getElementById('btnDownloadPartial').style.display = 'none';

      var totalLen = 0;
      for (var i = 1; i <= rxTotalExpected; i++) {
        totalLen += rxChunks[i].length;
      }

      var merged = new Uint8Array(totalLen);
      var offset = 0;
      for (var j = 1; j <= rxTotalExpected; j++) {
        merged.set(rxChunks[j], offset);
        offset += rxChunks[j].length;
      }

      var finalBytes = await decompressPayload(merged, rxMeta.comp);
      var calculatedCrc = crc32(finalBytes);
      var isVerified = (calculatedCrc === rxMeta.crc);

      var blob = new Blob([finalBytes], { type: rxMeta.mime });
      var url = URL.createObjectURL(blob);

      var previewContainer = document.getElementById('rxPreview');
      previewContainer.innerHTML = '';
      var mime = (rxMeta.mime || '').toLowerCase();

      if (mime.startsWith('image/')) {
        var img = document.createElement('img');
        img.src = url;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '200px';
        img.style.objectFit = 'contain';
        img.style.border = '1px solid #222222';
        img.style.display = 'block';
        previewContainer.appendChild(img);
      } else if (mime.startsWith('audio/')) {
        var audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;
        audio.style.width = '100%';
        previewContainer.appendChild(audio);
      } else if (mime.startsWith('video/')) {
        var videoEl = document.createElement('video');
        videoEl.controls = true;
        videoEl.playsInline = true;
        videoEl.src = url;
        videoEl.style.maxWidth = '100%';
        videoEl.style.maxHeight = '200px';
        videoEl.style.border = '1px solid #222222';
        videoEl.style.display = 'block';
        previewContainer.appendChild(videoEl);
      } else if (mime.startsWith('text/') || mime.includes('json') || mime.includes('javascript') || mime.includes('xml')) {
        try {
          var textSnippet = new TextDecoder('utf-8').decode(finalBytes.subarray(0, 1500));
          var pre = document.createElement('pre');
          pre.className = 'mono';
          pre.style.maxHeight = '120px';
          pre.style.overflowY = 'auto';
          pre.style.fontSize = '0.72rem';
          pre.style.background = '#0a0a0a';
          pre.style.border = '1px solid #222222';
          pre.style.padding = '8px';
          pre.style.width = '100%';
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.wordBreak = 'break-all';
          pre.textContent = textSnippet + (finalBytes.length > 1500 ? '\n... [truncated]' : '');
          previewContainer.appendChild(pre);
        } catch (e) {}
      }

      var downloadBtn = document.getElementById('rxDownloadBtn');
      downloadBtn.href = url;
      downloadBtn.download = rxMeta.name;
      downloadBtn.textContent = 'save ' + rxMeta.name.toLowerCase();

      document.getElementById('rxFileName').textContent = rxMeta.name.toLowerCase() + ' (' + formatBytes(finalBytes.length) + ') ' + (isVerified ? '• crc verified' : '• crc mismatch');
      document.getElementById('rxSuccessBox').style.display = 'flex';
      document.getElementById('rxStatus').textContent = 'complete';
      if (navigator.vibrate) navigator.vibrate(80);
    }
  </script>
</body>
</html>
